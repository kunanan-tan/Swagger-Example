env.key=@env.key@
# was "spring.profile.active" - a typo, so the profile was never actually activated
spring.profiles.active=@env.key@
initial.version=1.0

server.port=9000
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# do not advertise the container
server.tomcat.max-http-form-post-size=256KB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

spring.main.banner-mode=off
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# HTTP Basic credentials. Left unset on purpose: Spring Boot then generates a random
# password and logs it at startup, so an unconfigured deployment is never wide open.
# Set both in each environment:
#   spring.security.user.name=${APP_USER}
#   spring.security.user.password=${APP_PASSWORD}

# comma separated list, e.g. https://app.example.com,https://admin.example.com
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
